services:
  nginx-proxy:
    image: steveltn/https-portal:1.25.2
    container_name: nginx-proxy
    hostname: nginx-proxy
    restart: always
    environment:
      - STAGE=production
      - DOMAINS=portal-api.uryonym.com -> http://ynym-portal-backend:8080, portal.uryonym.com -> http://ynym-portal-frontend:3000, ynym-portal.uryonym.com -> http://ynym-portal:3000
      - TZ=Asia/Tokyo
    ports:
      - 80:80
      - 443:443
    volumes:
      - nginx-proxy-volume:/var/lib/https-portal
    networks:
      - ynym-portal-network

volumes:
  nginx-proxy-volume:
    name: nginx-proxy-volume
    driver: local

networks:
  default:
    name: nginx-proxy-network
  ynym-portal-network:
    name: ynym-portal-network
    external: true
