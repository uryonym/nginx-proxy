services:
  nginx-proxy:
    image: steveltn/https-portal:1.25.6
    container_name: nginx-proxy
    hostname: nginx-proxy
    restart: always
    environment:
      - STAGE=production
      - DOMAINS=portal.uryonym.com -> http://ynym-portal-frontend:3000
      - TZ=Asia/Tokyo
      - DYNAMIC_UPSTREAM=true
      - RESOLVER=127.0.0.11 ipv6=off valid=10s
      - |
        CUSTOM_NGINX_PORTAL_URYONYM_COM_CONFIG_BLOCK=
        location /api/ {
            set $$backend "http://ynym-portal-backend:8000";
            proxy_pass $$backend;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
        }
    ports:
      - 80:80
      - 443:443
    volumes:
      - nginx-proxy-volume:/var/lib/https-portal
    networks:
      - nginx-proxy-network

volumes:
  nginx-proxy-volume:
    name: nginx-proxy-volume
    driver: local

networks:
  nginx-proxy-network:
    name: nginx-proxy-network
    external: true
